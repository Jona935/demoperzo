name: Build Claude Bubble APK

on:
  push:
    branches: [ "claude/floating-chat-bubble-app-XqMWw", "main" ]
    paths:
      - "claude-bubble-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        working-directory: claude-bubble-android
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: claude-bubble-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: claude-bubble-debug
          path: claude-bubble-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK size
        run: |
          APK=claude-bubble-android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(du -h $APK | cut -f1)"
