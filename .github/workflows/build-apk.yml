name: Build Claude Bubble APK

on:
  push:
    branches: [ "claude/floating-chat-bubble-app-XqMWw", "main" ]
    paths:
      - "claude-bubble-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          # ubuntu-latest runners have the SDK at $ANDROID_SDK_ROOT
          echo "Android SDK root: $ANDROID_SDK_ROOT"
          ls $ANDROID_SDK_ROOT/cmdline-tools/ || true

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          # Accept all licenses non-interactively
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # Install platform and build tools
          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle wrapper
        working-directory: claude-bubble-android
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: claude-bubble-android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: claude-bubble-debug
          path: claude-bubble-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
